name: Smoke Test — Install Script

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      preset_id:
        description: "Preset ID to test (default: clean-signal)"
        default: "clean-signal"
        required: false

jobs:
  smoke:
    # Only run if the deploy succeeded (or manually triggered)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get install -y jq curl

      - name: Wait for GitHub Pages propagation
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 30

      - name: Run install script (clean-signal)
        env:
          PRESET_ID: ${{ github.event.inputs.preset_id || 'clean-signal' }}
          SITE_BASE: "https://brit-juho.github.io/claude-statusline-market"
        run: |
          bash scripts/install-preset.sh "$PRESET_ID"

      - name: Verify settings.json was written
        env:
          PRESET_ID: ${{ github.event.inputs.preset_id || 'clean-signal' }}
        run: |
          SETTINGS="${XDG_CONFIG_HOME:-$HOME/.config}/ccstatusline/settings.json"

          if [ ! -f "$SETTINGS" ]; then
            echo "ERROR: settings.json not found at $SETTINGS" >&2
            exit 1
          fi

          echo "✓ settings.json exists"

          # Validate JSON
          jq empty "$SETTINGS" || { echo "ERROR: invalid JSON" >&2; exit 1; }
          echo "✓ valid JSON"

          # Verify ccstatusline v3 format: version=3 and lines[0] non-empty
          VERSION=$(jq '.version' "$SETTINGS")
          if [ "$VERSION" != "3" ]; then
            echo "ERROR: expected version=3, got $VERSION" >&2
            exit 1
          fi
          echo "✓ version=3"

          COUNT=$(jq '.lines[0] | length' "$SETTINGS")
          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: no widgets in lines[0]" >&2
            exit 1
          fi
          echo "✓ $COUNT widget(s) in lines[0]"

          # Verify all types are kebab-case (no underscores)
          SNAKE=$(jq -r '.lines[0][].type' "$SETTINGS" | grep '_' || true)
          if [ -n "$SNAKE" ]; then
            echo "ERROR: snake_case type(s) found: $SNAKE" >&2
            exit 1
          fi
          echo "✓ all widget types are kebab-case"

          echo "Settings installed from preset: $PRESET_ID"
          cat "$SETTINGS"

  smoke-windows:
    # Same checks as `smoke`, but exercises install-preset.ps1 (T15) —
    # no local Windows machine needed, this runs on GitHub's own
    # windows-latest cloud runner.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for GitHub Pages propagation
        if: ${{ github.event_name == 'workflow_run' }}
        shell: pwsh
        run: Start-Sleep -Seconds 30

      - name: Run install script (Install-Preset)
        shell: pwsh
        env:
          PRESET_ID: ${{ github.event.inputs.preset_id || 'clean-signal' }}
        run: |
          . .\scripts\install-preset.ps1
          Install-Preset -PresetId $env:PRESET_ID -SiteBase "https://brit-juho.github.io/claude-statusline-market"

      - name: Verify settings.json was written
        shell: pwsh
        env:
          PRESET_ID: ${{ github.event.inputs.preset_id || 'clean-signal' }}
        run: |
          $settingsPath = Join-Path $HOME ".config" "ccstatusline" "settings.json"

          if (-not (Test-Path $settingsPath)) {
            Write-Error "settings.json not found at $settingsPath"
            exit 1
          }
          Write-Host "✓ settings.json exists"

          $json = Get-Content $settingsPath -Raw | ConvertFrom-Json
          if ($json.version -ne 3) {
            Write-Error "expected version=3, got $($json.version)"
            exit 1
          }
          Write-Host "✓ version=3"

          $widgets = $json.lines[0]
          if ($widgets.Count -lt 1) {
            Write-Error "no widgets in lines[0]"
            exit 1
          }
          Write-Host "✓ $($widgets.Count) widget(s) in lines[0]"

          $snakeCase = $widgets | Where-Object { $_.type -match '_' }
          if ($snakeCase) {
            Write-Error "snake_case type(s) found: $($snakeCase.type -join ', ')"
            exit 1
          }
          Write-Host "✓ all widget types are kebab-case"

          # T10 regression check: past versions moved the whole preset file
          # as-is, so id/title/description ended up mixed into ccstatusline's
          # own settings.json instead of just {version, lines}.
          $extraProps = $json.PSObject.Properties.Name | Where-Object { $_ -notin @('version', 'lines') }
          if ($extraProps) {
            Write-Error "unexpected top-level keys leaked from the preset file: $($extraProps -join ', ')"
            exit 1
          }
          Write-Host "✓ no preset metadata leaked into ccstatusline settings"

          Write-Host "Settings installed from preset: $env:PRESET_ID"
          Get-Content $settingsPath | Write-Host
